plugins {
    id 'java'
}

// Burp Suite ships FlatLaf itself, so we only compile against it. Keep this in step with the
// FlatLaf version bundled in the Burp release you are targeting (3.6+ at the time of writing).
def flatlafVersion = '3.7'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // Lets any JDK >= 21 produce Java 21 bytecode without needing a matching toolchain installed.
    options.release = 21
}

repositories {
    mavenCentral()
    maven {
        url = 'https://jitpack.io'
        content { includeGroupByRegex 'com\\.github\\..*' }
    }
}

// Optional: a Burp Suite jar, only needed to launch Burp from the IDE (TestPlugin) or to run
// the themeSmokeTest task. Pass -PburpJar=/path/to/burpsuite.jar, or drop the jar in the
// project root as burpsuite_pro.jar / burpsuite_community.jar / burpsuite.jar.
def burpJar = providers.gradleProperty('burpJar').map { file(it) }.orElse(provider {
    ['burpsuite_pro.jar', 'burpsuite_community.jar', 'burpsuite.jar']
            .collect { file(it) }
            .find { it.exists() }
}).orNull

dependencies {
    compileOnly 'net.portswigger.burp.extensions:montoya-api:2023.12.1'
    compileOnly "com.formdev:flatlaf:${flatlafVersion}"        // Shipped in Burp
    compileOnly "com.formdev:flatlaf-extras:${flatlafVersion}" // Shipped in Burp

    implementation 'com.github.CoreyD97:Burp-Montoya-Utilities:2993e293'
    implementation("com.formdev:flatlaf-intellij-themes:${flatlafVersion}") {
        // Only the theme classes/json are bundled. FlatLaf core must come from Burp.
        exclude group: 'com.formdev', module: 'flatlaf'
    }

    if (burpJar != null) {
        testRuntimeOnly files(burpJar)
    }
}

jar {
    archiveBaseName = project.name
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    includeEmptyDirs = false
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'module-info.class'
    // The Burp-Montoya-Utilities artifact is itself a fat jar, which drags in the Montoya API (provided
    // by Burp) and the whole of Lombok (a compile time only tool). Neither belongs in an extension.
    exclude 'burp/api/**', 'lombok/**', 'Class50/**', 'com/zwitserloot/**', 'org/objectweb/asm/**'
    exclude 'META-INF/services/lombok.*', 'META-INF/services/javax.annotation.processing.Processor'
    exclude 'META-INF/gradle/**', 'AUTHORS', 'changelog.txt', 'latestchanges.html', 'release-timestamp.txt',
            'README.md', 'AboutMain.png'
    destinationDirectory = file("$rootDir/releases")
}

// Loads the built jar the way Burp does, then applies every bundled theme against a real Burp jar.
// Usage: ./gradlew themeSmokeTest -PburpJar=/path/to/burpsuite.jar
tasks.register('themeSmokeTest', JavaExec) {
    group = 'verification'
    description = 'Loads the extension jar and every bundled theme against a Burp Suite jar (-PburpJar=...).'
    dependsOn tasks.named('jar'), tasks.named('testClasses')
    mainClass = 'ThemeSmokeTest'
    // Only the test classes and Burp. The extension must be loaded from its jar, as it is in Burp.
    classpath = files(sourceSets.test.output, burpJar ?: [])
    systemProperty 'java.awt.headless', 'true'
    systemProperty 'extensionJar', tasks.named('jar').flatMap { it.archiveFile }.get().asFile
    if (providers.gradleProperty('burpExtensionLoader').isPresent()) {
        systemProperty 'burpExtensionLoader', providers.gradleProperty('burpExtensionLoader').get()
    }
    doFirst {
        if (burpJar == null || !burpJar.exists()) {
            throw new GradleException('No Burp jar found. Pass -PburpJar=/path/to/burpsuite.jar')
        }
    }
}
